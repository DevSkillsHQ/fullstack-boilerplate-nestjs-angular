version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/app-frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      # TypeScript 7 is the Go rewrite; ts-jest and the Angular compiler do not run on it yet.
      - dependency-name: "typescript"
        versions: [">=7"]
    groups:
      angular:
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"
          - "@schematics/angular"
          - "zone.js"
        update-types:
          - "major"
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "npm"
    directory: "/app-backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      # TypeScript 7 is the Go rewrite; ts-jest and the Angular compiler do not run on it yet.
      - dependency-name: "typescript"
        versions: [">=7"]
    groups:
      nestjs:
        patterns:
          - "@nestjs/*"
        update-types:
          - "major"
      eslint:
        patterns:
          - "eslint"
          - "@eslint/*"
          - "eslint-*"
          - "typescript-eslint"
          - "@typescript-eslint/*"
          - "globals"
        update-types:
          - "major"
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
